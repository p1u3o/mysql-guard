services:
  consul:
    image: hashicorp/consul:1.19
    command: agent -dev -client=0.0.0.0 -ui
    ports:
      - "8500:8500"

  db-a:
    image: mysql:8.4
    hostname: db-a
    environment:
      MYSQL_ROOT_PASSWORD: placeholder
      MYSQL_ROOT_HOST: "%"
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
    ports:
      - "33061:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pplaceholder"]
      interval: 5s
      retries: 15
    volumes:
      - ./scripts/init-primary.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

  db-b:
    image: mysql:8.4
    hostname: db-b
    environment:
      MYSQL_ROOT_PASSWORD: placeholder
      MYSQL_ROOT_HOST: "%"
    command:
      - --server-id=2
      - --log-bin=mysql-bin
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
    ports:
      - "33062:3306"
    depends_on:
      db-a:
        condition: service_healthy
    volumes:
      - ./scripts/bootstrap-replica.sh:/docker-entrypoint-initdb.d/02-replica.sh:ro

  guard-a:
    build:
      context: ..
      dockerfile: integration/Dockerfile
    depends_on:
      - consul
      - db-a
      - db-b
    environment:
      CONSUL_HTTP_ADDR: consul:8500
      MYSQL_PASSWORD: placeholder
      MYSQL_REPL_USER: repl
      MYSQL_REPL_PASSWORD: placeholder
      REPL_CONNECT_TIMEOUT: 15s
    command:
      - --node=db-a
      - --mysql-host=db-a
      - --role=db
      - --mode=act
      - --cluster=example
      - --peers=db-a,db-b
      - --mysql-user=root
      - --mysql-peer-endpoints=db-a=db-a:3306,db-b=db-b:3306
      - --interval=2s
      - --stall-after=10s
      - --min-between-failovers=20s
      - --session-ttl=10s
      - --lock-delay=1s
      - --http=:9471
    ports:
      - "9471:9471"

  guard-b:
    build:
      context: ..
      dockerfile: integration/Dockerfile
    depends_on:
      - consul
      - db-a
      - db-b
    environment:
      CONSUL_HTTP_ADDR: consul:8500
      MYSQL_PASSWORD: placeholder
      MYSQL_REPL_USER: repl
      MYSQL_REPL_PASSWORD: placeholder
      REPL_CONNECT_TIMEOUT: 15s
    command:
      - --node=db-b
      - --mysql-host=db-b
      - --role=db
      - --mode=act
      - --cluster=example
      - --peers=db-a,db-b
      - --mysql-user=root
      - --mysql-peer-endpoints=db-a=db-a:3306,db-b=db-b:3306
      - --interval=2s
      - --stall-after=10s
      - --min-between-failovers=20s
      - --session-ttl=10s
      - --lock-delay=1s
      - --http=:9472
    ports:
      - "9472:9472"

  guard-witness:
    build:
      context: ..
      dockerfile: integration/Dockerfile
    depends_on:
      - consul
      - db-a
      - db-b
    environment:
      CONSUL_HTTP_ADDR: consul:8500
      MYSQL_PASSWORD: placeholder
    command:
      - --node=witness-1
      - --role=witness
      - --mode=act
      - --cluster=example
      - --peers=db-a,db-b
      - --mysql-user=root
      - --mysql-peer-endpoints=db-a=db-a:3306,db-b=db-b:3306
      - --interval=2s
      - --stall-after=10s
      - --min-between-failovers=20s
      - --session-ttl=10s
      - --lock-delay=1s
      - --http=:9473
    ports:
      - "9473:9473"
